const sv={money:0,owned:[0],car:0,diff:1,lang:/^(ru|kk|be|uk)/.test(navigator.language)?'ru':'en',theme:0,snd:1,best:0,ms:[],done:0,up:{},stat:{runs:0,dist:0,coins:0,cars:0,kmh:0},day:'',streak:0};

if(!sv.owned.includes(sv.car))sv.car=0;
best=sv.best;
const save=()=>{try{localStorage.setItem('sh_save',JSON.stringify(sv))}catch(e){}};
const tr=k=>I[sv.lang][k]||k,li=()=>sv.lang==='ru'?0:1;
let D=DIFFS[sv.diff]||DIFFS[1],pv=0,scr='menu',earn=0,ST={passes:0,kmh:0,nitro:0,time:0,score:0};
// миссии
const MB={passes:{g:6,r:50},kmh:{g:185,r:60},nitro:{g:6,r:60},time:{g:45,r:70},score:{g:700,r:80},coins:{g:15,r:55},near:{g:4,r:65},pads:{g:2,r:55}},MK={passes:'mp',kmh:'mk',nitro:'mn',time:'mt',score:'ms',coins:'mc',near:'mr',pads:'md'};
function mkM(ex){
  const ks=Object.keys(MB).filter(k=>!ex.includes(k)),k=ks[Math.random()*ks.length|0],b=MB[k],f=1+sv.done*.12;
  return {k,g:k==='kmh'?Math.min(330,Math.round(b.g+sv.done*4)):Math.round(b.g*f),r:Math.round(b.r*f)};
}
function refreshM(){
  sv.ms=sv.ms.map((m,i,a)=>m.d?mkM(a.filter((_,j)=>j!==i).map(x=>x.k)):m);
  while(sv.ms.length<4)sv.ms.push(mkM(sv.ms.map(m=>m.k)));
  save();
}
function chkM(){
  for(const m of sv.ms)if(!m.d&&ST[m.k]>=m.g){
    m.d=1;sv.money+=m.r;sv.done++;save();
    fl.push({t:0,d:2.4,s:tr('mdone')+' +'+m.r,y:200,z:26});
  }
}
refreshM();
const stats=i=>{const u=sv.up[i]||[0,0,0],c=CARS[i];return {sp:c.sp*(1+.03*u[0]),hd:c.hd*(1+.05*u[1]),nr:c.nr*(1+.08*u[2])}};
const upCost=(i,j)=>Math.round((150+CARS[i].p*.12)*((sv.up[i]||[0,0,0])[j]+1));
let CS=stats(sv.car),bonus=0,runCoins=0,pk=[],hz=[],slipT=0,shieldT=0,multT=0,boostT=0,wx={k:0,t:25,a:0,ty:1},nextPk=0,nextHz=0;
const today=()=>new Date().toISOString().slice(0,10);
const dailyNext=()=>sv.day===new Date(Date.now()-864e5).toISOString().slice(0,10)?Math.min(7,sv.streak+1):1;
const fgG=g.createLinearGradient(0,HZ-60,0,H*.85);fgG.addColorStop(0,'rgba(210,200,230,.95)');fgG.addColorStop(.45,'rgba(210,200,230,.6)');fgG.addColorStop(1,'rgba(210,200,230,0)');
Object.assign(I.ru,{insane:'Безумная',about:'Об игре и авторы',daily:'Ежедневный бонус',shield:'ЩИТ',boost:'БУСТ',rain:'Дождь! Дорога скользкая',fog:'Туман! Видимость упала',rainS:'ДОЖДЬ',fogS:'ТУМАН',oil:'МАСЛО',oilT:'Масло! Занос',p1:'Нитро заряжено!',p2:'Щит!',p3:'Очки ×2!',p4:'+1 жизнь',near:'Близко!',mc:'Собери {n} монет за заезд',mr:'Сделай {n} опасных обгонов',md:'Поймай {n} ускорителя на дороге',s_runs:'Заездов',s_dist:'Дистанция, км',s_coins:'Монет собрано',s_cars:'Обгонов',s_kmh:'Рекорд скорости, км/ч',ab1:'Автор и идея',ab2:'Код создан совместно с',rights:'© 2026 Zhaukenov Sanzhar. Все права защищены.',legal:'Игра создана Zhaukenov Sanzhar при участии ИИ Claude (Anthropic). Копирование, распространение и изменение без письменного разрешения автора запрещены. Игра предоставляется «как есть», без гарантий.'});
Object.assign(I.en,{insane:'Insane',about:'About & credits',daily:'Daily bonus',shield:'SHIELD',boost:'BOOST',rain:'Rain! Slippery road',fog:'Fog! Low visibility',rainS:'RAIN',fogS:'FOG',oil:'OIL',oilT:'Oil! Skidding',p1:'Nitro refilled!',p2:'Shield!',p3:'Score x2!',p4:'+1 life',near:'Close call!',mc:'Collect {n} coins in one run',mr:'Make {n} close overtakes',md:'Hit {n} boost pads',s_runs:'Runs',s_dist:'Distance, km',s_coins:'Coins collected',s_cars:'Overtakes',s_kmh:'Top speed, km/h',ab1:'Author & concept',ab2:'Code co-created with',rights:'© 2026 Zhaukenov Sanzhar. All rights reserved.',legal:'The game was created by Zhaukenov Sanzhar with the help of the AI Claude (Anthropic). Copying, distribution or modification without the written permission of the author is prohibited. The game is provided as is, without warranty.'});
let T,skyG,sunG,fogG;
function applyTheme(){
  T=THEMES[sv.theme]||THEMES[0];
  skyG=g.createLinearGradient(0,0,0,HZ);T.sky.forEach((c,i)=>skyG.addColorStop([0,.5,.8,1][i],c));
  sunG=g.createLinearGradient(0,HZ-113,0,HZ+43);sunG.addColorStop(0,T.sun[0]);sunG.addColorStop(1,T.sun[1]);
  fogG=g.createLinearGradient(0,HZ-60,0,HZ+130);
  fogG.addColorStop(0,'rgba('+T.fog+',0)');fogG.addColorStop(.32,'rgba('+T.fog+',.6)');fogG.addColorStop(1,'rgba('+T.fog+',0)');

function lab(){

const inp={l:0,r:0,b:0,n:0};
const LANES=[-.62,0,.62],COLS=['#2ec4b6','#ffd166','#4cc9f0','#b388ff','#f4f1de','#80ed99','#4361ee'];

  for(let k=0;k<8;k++){

    c.x=LANES[Math.random()*3|0]+(Math.random()-.5)*.1;

function reset(){
  pos=0;speed=700;px=0;lives=D.lv;nitro=1;inv=0;shake=0;flash=0;time=0;passes=0;bonus=0;runCoins=0;fl=[];cars=[];pk=[];hz=[];

// ---- звук ----
let ac,osc,gn;
function snd(){
  if(ac){ac.resume&&ac.resume();return}
  try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gn=ac.createGain();osc.type='sawtooth';gn.gain.value=0;osc.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}
}
function eng(){if(!ac)return;osc.frequency.value=50+speed*.06;gn.gain.value=st==='play'&&sv.snd?.035:0}
function beep(){
  if(!ac||!sv.snd)return;

function crash(c){
  if(shieldT>0){shieldT=0;shake=.25;flash=.2;inv=.8;beep();spawn(c);return}
  lives--;speed*=.3;shake=.5;flash=.45;inv=1.8;beep();spawn(c);
  if(lives<=0)over();
}
function update(dt){
  time+=dt;
  const C=CS,rain=wx.k===1,base=Math.min(2000,1300+time*7)*D.sp*(1+(C.sp-1)*.4),steer=inp.r-inp.l,sp=speed/1600;
  const grip=(rain?.75:1)*(slipT>0?.55:1);
  px+=steer*dt*(1.5+Math.min(sp,1.3)*.5)*C.hd*grip;
  if(slipT>0)px+=Math.sin(time*11)*dt*1.1;
  px-=curve(pos+308)*dt*.42*Math.pow(Math.min(sp,1.6),2)*(rain?1.15:1);
  px=Math.max(-1.9,Math.min(1.9,px));
  let tgt=base,acc=520;nOn=0;
  if(inp.n&&nitro>0&&!inp.b){tgt=base+700;acc=900;nitro=Math.max(0,nitro-dt*.4);nOn=1}else nitro=Math.min(1,nitro+dt*.1*C.nr);
  if(boostT>0){tgt=Math.max(tgt,base+900);acc=1600}
  if(inp.b)tgt=350;
  if(Math.abs(px)>1.05){tgt=Math.min(tgt,520);shake=Math.max(shake,.12)}
  const d=tgt-speed,rt=(d<0?1400:acc)*dt;
  speed+=Math.abs(d)<rt?d:Math.sign(d)*rt;
  pos+=speed*dt;
  bgx-=curve(pos+308)*speed*dt*.012;
  inv=Math.max(0,inv-dt);slipT=Math.max(0,slipT-dt);shieldT=Math.max(0,shieldT-dt);multT=Math.max(0,multT-dt);boostT=Math.max(0,boostT-dt);
  const m=multT>0?2:1;
  ST.kmh=Math.max(ST.kmh,speed/9.5);ST.time=time;ST.passes=passes;ST.score=Math.floor(pos/60)+bonus;if(nOn)ST.nitro+=dt;
  chkM();
  wx.t-=dt;wx.a+=((wx.k?1:0)-wx.a)*Math.min(1,dt*1.2);
  if(wx.t<=0&&time>15){
    if(wx.k){wx.k=0;wx.t=(26+Math.random()*20)/(1+.25*sv.diff)}
    else{wx.k=wx.ty=1+(Math.random()<.5?1:0);wx.t=14+Math.random()*10;fl.push({t:0,d:2.2,s:tr(wx.k===1?'rain':'fog'),y:240,z:24})}
  }
  const pz=pos+308;
  for(const c of cars){
    c.z+=c.v*dt;
    const dz=c.z-pz;
    if(Math.abs(dz)<150)c.g=Math.min(c.g,Math.abs(c.x-px));
    if(inv<=0&&Math.abs(dz)<85+speed*dt&&Math.abs(c.x-px)<(c.t?.38:.3)){crash(c);if(st!=='play')return}
    if(!c.p&&dz<-120){
      c.p=1;passes++;bonus+=100*m;fl.push({t:0,s:'+'+100*m});
      if(c.g<.62){ST.near++;bonus+=50*m;fl.push({t:0,d:1.3,s:tr('near')+' +'+50*m,y:500,z:26})}
    }
    if(c.z<pos-400)spawn(c);
  }
  for(const o of pk)if(!o.g&&Math.abs(o.z-pz)<60+speed*dt&&Math.abs(o.x-px)<.3){o.g=1;take(o.k)}
  for(const o of hz)if(!o.g&&Math.abs(o.z-pz)<60+speed*dt){
    const dx=Math.abs(o.x-px);
    if(o.k===2&&dx<.4){o.g=1;boostT=2.2;ST.pads++;blip(500);fl.push({t:0,s:tr('boost'),y:520,z:28})}
    else if(o.k===0&&dx<.35){o.g=1;slipT=1.6;fl.push({t:0,d:1.3,s:tr('oilT'),y:520,z:26})}
    else if(o.k===1&&dx<.22){o.g=1;if(shieldT>0){shieldT=0;blip(300)}else{speed*=.55;shake=.3;flash=.2;beep()}}
  }
  genItems();
}
function take(k){
  if(k===0){sv.money+=5;runCoins+=5;ST.coins++;blip(880);return}
  blip(660);
  if(k===1)nitro=1;else if(k===2)shieldT=10;else if(k===3)multT=12;else lives=Math.min(D.lv+1,lives+1);

}
function genItems(){

      const lx=cx+s*hw*1.3;
      g.fillStyle=T.pl;g.fillRect(lx-(3*t+.8)/2,y-ph,3*t+.8,ph);
      g.fillStyle=T.lg;g.beginPath();g.arc(lx,y-ph,16*t+2,0,7);g.fill();
      g.fillStyle=T.lh;g.beginPath();g.arc(lx,y-ph,5*t+.8,0,7);g.fill();
    }
  }
  const items=hz.map(o=>({z:o.z,h:1,o})).concat(pk.filter(o=>!o.g).map(o=>({z:o.z,o}))).sort((a,b)=>b.z-a.z);
  for(const it of items){
    const dz=it.z-pos;if(dz<215)continue;
    const t=200/dz,i=Math.min(N,Math.round(t*N));if(i<1)continue;
    const o=it.o,hw=rhw[i],x=rcx[i]+o.x*hw,y=HZ+i*STEP;
    if(it.h)hzd(o,x,y,hw);else pkd(o,x,y,hw);
  }
  // машины
  const vis=cars.filter(c=>c.z-pos>238).sort((a,b)=>b.z-a.z);
  for(const c of vis){
    const t=200/(c.z-pos),i=Math.min(N,Math.round(t*N));if(i<1)continue;
    c.t?truck(rcx[i]+c.x*rhw[i],HZ+i*STEP,rhw[i]*.42*1.22,c.col):car(rcx[i]+c.x*rhw[i],HZ+i*STEP,rhw[i]*.42,c.col);
  }
  // игрок
  if((st==='play'||st==='pause'||st==='over')&&!(inv>0&&((inv*12)|0)%2)){
    const i=Math.round(200/308*N),w=rhw[i]*.42,py=HZ+i*STEP,pxx=rcx[i]+px*rhw[i];
    g.save();g.translate(pxx,py);g.rotate((inp.r-inp.l)*.05);
    if(nOn||boostT>0){
      g.fillStyle=Math.random()<.5?'#ffb454':'#ffe27a';
      for(const s of[-1,1]){g.beginPath();g.moveTo(s*w*.32-w*.07,-2);g.lineTo(s*w*.32+w*.07,-2);g.lineTo(s*w*.32,w*(.3+Math.random()*.25));g.fill()}
    }
    car(0,0,w,CARS[sv.car].col,inp.b?'#ffa0ad':null,CARS[sv.car].k);
    if(shieldT>0){g.strokeStyle='rgba(68,224,208,'+(.5+.3*Math.sin(Date.now()/120))+')';g.lineWidth=4;g.beginPath();g.arc(0,-w*.35,w*.85,0,7);g.stroke()}
    g.restore();
  }
  if(scr==='garage'&&st==='menu'){const c=CARS[pv];car(W/2,440+Math.sin(Date.now()/500)*4,210,c.col,null,c.k)}
  // дымка у горизонта
  g.fillStyle=fogG;g.fillRect(-20,HZ-60,W+40,190);
  if(wx.a>.02){
    g.globalAlpha=wx.a;
    if(wx.ty===1){
      g.fillStyle='rgba(10,10,45,.28)';g.fillRect(-20,-20,W+40,H+40);
      g.strokeStyle='rgba(200,220,255,.45)';g.lineWidth=1.2;g.beginPath();
      for(let k=0;k<70;k++){const rx=Math.random()*W,ry=Math.random()*H;g.moveTo(rx,ry);g.lineTo(rx-4,ry+22)}
      g.stroke();
    }else{g.fillStyle=fgG;g.fillRect(-20,HZ-60,W+40,H)}
    g.globalAlpha=1;
  }
  // скоростные линии
  if(nOn||boostT>0){g.fillStyle='rgba(255,255,255,.2)';for(let k=0;k<14;k++){const lx=Math.random()<.5?Math.random()*60:W-Math.random()*60;g.fillRect(lx,200+Math.random()*H*.6,1.5,60+Math.random()*90)}}
  if(flash>0){g.fillStyle='rgba(255,60,90,'+Math.min(.5,flash)+')';g.fillRect(-20,-20,W+40,H+40)}
  g.restore();
  // HUD
  if(st==='play'||st==='pause'||st==='over'){
    txt(String(score),22,80,'italic 900 42px Impact,"Arial Narrow",sans-serif','left');
    g.font='italic 800 17px "Avenir Next Condensed","Arial Narrow",sans-serif';g.textAlign='left';g.fillStyle='rgba(246,236,216,.75)';g.fillText(tr('best')+' '+Math.max(best,score),22,104);
    txt(String(Math.round(speed/9.5)),W-70,80,'italic 900 42px Impact,"Arial Narrow",sans-serif','right');
    g.font='italic 800 17px "Avenir Next Condensed","Arial Narrow",sans-serif';g.textAlign='left';g.fillStyle='rgba(246,236,216,.75)';g.fillText(tr('kmh'),W-64,80);
    for(let i=0;i<lives;i++)car(36+i*34,140,24,CARS[sv.car].col);
    rr(W-146,96,124,12,6,'rgba(246,236,216,.25)');
    if(nitro>.02)rr(W-146,96,124*nitro,12,6,'#ffb454');
    g.fillStyle='#ffb454';g.beginPath();g.arc(W-30,128,8,0,7);g.fill();
    g.font='italic 800 20px "Avenir Next Condensed","Arial Narrow",sans-serif';g.textAlign='right';g.fillStyle='#f6ecd8';g.fillText('+'+runCoins,W-44,134);
    let cx=22;const ch=(q,c)=>{g.font='italic 800 15px "Avenir Next Condensed","Arial Narrow",sans-serif';const w=g.measureText(q).width+16;rr(cx,162,w,24,12,c);g.fillStyle='#fff';g.textAlign='left';g.fillText(q,cx+8,179);cx+=w+6};
    if(shieldT>0)ch(tr('shield')+' '+Math.ceil(shieldT),'rgba(30,160,150,.9)');
    if(multT>0)ch('×2 '+Math.ceil(multT),'rgba(200,60,170,.9)');
    if(boostT>0)ch(tr('boost'),'rgba(220,130,30,.95)');
    if(wx.k)ch(tr(wx.k===1?'rainS':'fogS'),'rgba(60,90,170,.9)');
    if(slipT>0)ch(tr('oil'),'rgba(90,60,120,.95)');
    g.globalAlpha=1;
    for(const f of fl){g.globalAlpha=1-f.t;txt(f.s,W/2,f.y||560-f.t*90,'italic 900 '+(f.z||36)+'px Impact,"Arial Narrow",sans-serif','center','#ffb454')}
    g.globalAlpha=1;
  }
}

// ---- управление ----
function bind(id,k){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();inp[k]=1;el.classList.add('on')};
  const off=e=>{e.preventDefault();inp[k]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind('bl','l');bind('br','r');bind('bb','b');bind('bn','n');
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'b',Space:'b',ArrowUp:'n',ShiftLeft:'n'};
addEventListener('keydown',e=>{if(KM[e.code]){inp[KM[e.code]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.code])inp[KM[e.code]]=0});
addEventListener('blur',()=>{inp.l=inp.r=inp.b=inp.n=0});

let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(st==='play')update(dt);else if(st!=='pause')idle(dt);
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.2);
  for(const f of fl)f.t+=dt/(f.d||1);fl=fl.filter(f=>f.t<1);
  score=Math.floor(pos/60)+bonus;
  render();eng();
  requestAnimationFrame(loop);
}
reset();applyTheme();lab();show('menu');requestAnimationFrame(loop);
</script>
